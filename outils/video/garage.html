<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>Cars Factory 21 · présentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
@font-face { font-family: BC; src: url("file:///C:/Users/ST/Projet_perso/carsfactory21-site/node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2"); font-weight: 700; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
#film { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
.s { position: absolute; inset: 0; opacity: 0; }
.s > svg, #grain { position: absolute; inset: 0; width: 1920px; height: 1080px; }
.carte { position: absolute; left: 110px; top: 80px; max-width: 1100px; padding: 26px 40px 30px; border-radius: 28px;
  background: rgba(255, 250, 240, 0.9); box-shadow: 0 18px 50px rgba(40, 25, 10, 0.25); color: #3B2F2A; opacity: 0;
  font-family: "Zen Maru Gothic", BC, sans-serif; }
.carte .etq { display: inline-block; padding: 6px 16px; border-radius: 999px; background: #D23A2B; color: #fff; font-weight: 700; font-size: 26px; letter-spacing: 1px; }
.carte .titre { margin-top: 12px; font-weight: 900; font-size: 64px; line-height: 1.05; }
.carte .sous { margin-top: 10px; font-weight: 500; font-size: 32px; color: #6B5A4E; }
.grand-titre { position: absolute; left: 0; right: 0; text-align: center; font-family: "Zen Maru Gothic", BC, sans-serif; color: #FFFBF2; opacity: 0;
  text-shadow: 0 5px 0 rgba(70, 45, 25, 0.35), 0 12px 40px rgba(40, 30, 60, 0.35); }
#grain { pointer-events: none; mix-blend-mode: multiply; opacity: 0.16; }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(40, 25, 15, 0.35) 100%); }
</style></head>
<body>
<div id="film"></div>
<svg id="grain" viewBox="0 0 1920 1080"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 1.2 -0.25"/></filter><rect width="1920" height="1080" filter="url(#g)"/></svg>
<div id="vignette"></div>

<script>
/* ═══════════════ Outils ═══════════════ */
const $ = (id) => document.getElementById(id)
const c01 = (x) => Math.max(0, Math.min(1, x))
const lisse = (x) => { x = c01(x); return x * x * (3 - 2 * x) }
const sortie = (x) => { x = c01(x); return 1 - Math.pow(1 - x, 3) }
const entre = (t, a, b) => c01((t - a) / (b - a))
const lerp = (a, b, x) => a + (b - a) * x
function hasard(graine) { let a = graine; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
const attr = (el, o) => { for (const k in o) el.setAttribute(k, o[k]) }

/* ═══════════════ La voiture (même dessin que le logo) ═══════════════ */
const CONTOUR = 'M12,54 L12,42 Q13,37 22,36 L40,35 L150,15 Q160,13 168,14 L178,15 Q186,17 200,31 L276,32 Q290,33 293,38 L294,50 Q294,56 288,56 L266,56 A21,21 0 0 0 224,56 L92,56 A21,21 0 0 0 50,56 L18,56 Q12,56 12,54 Z'
const VITRE = 'M116,29 L150,19 L175,18.5 Q182,20 191,30 Z'
const OUIES = 'M88,33 L96,31 M92,37 L101,35 M96,41 L106,39'
const DETAILS = 'M196,33 L200,55 M186,38 L194,38 M288,40 Q292,41 293,45 M280,51 L294,51 M12,48 L20,48 M14,40 L19,40 L19,45 L14,45'
const LETTRES = 'M150,40 L114,40 Q102,40 102,46.5 Q102,53 114,53 L148,53 M158,53 L158,40 L284,39 M158,46.5 L184,46.5'

function roue(id, x) {
  return `<g><circle cx="${x}" cy="57" r="16" fill="#2F2B2A"/><circle cx="${x}" cy="57" r="10.5" fill="#D5DADF" stroke="#2F2B2A" stroke-width="1"/>
  <g id="${id}"><path d="M${x},47.5 V66.5 M${x - 9.5},57 H${x + 9.5} M${x - 6.7},50.3 L${x + 6.7},63.7 M${x - 6.7},63.7 L${x + 6.7},50.3" stroke="#8A9299" stroke-width="1.6"/></g>
  <circle cx="${x}" cy="57" r="3.2" fill="#8A9299" stroke="#2F2B2A" stroke-width=".8"/></g>`
}
function voiture(id, o = {}) {
  const caisse = o.caisse ?? '#F5EDDF', trait = '#2E2A28', bande = o.bande ?? '#D23A2B'
  return `<g id="${id}">
    <ellipse cx="153" cy="74" rx="150" ry="5.5" fill="rgba(45,32,20,.22)"/>
    <path id="${id}-caisse" d="${CONTOUR}" fill="${caisse}" stroke="${trait}" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M22,37 L150,16 Q160,14 168,15 L178,16" fill="none" stroke="#fff" stroke-width="2" opacity=".55" stroke-linecap="round"/>
    ${o.surCaisse ?? ''}
    <path d="${VITRE}" fill="#A9D3E7" stroke="${trait}" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M124,27.5 L148,21.5" stroke="#fff" stroke-width="2.4" opacity=".75" stroke-linecap="round"/>
    <path d="M160,19 L162,30" stroke="${trait}" stroke-width="1.6"/>
    <path d="${OUIES}" stroke="${trait}" stroke-width="1.4" stroke-linecap="round"/>
    <path d="${DETAILS}" fill="none" stroke="${trait}" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="287" cy="42.5" r="3" fill="#FFF3C4" stroke="${trait}" stroke-width="1.2"/>
    <path d="${LETTRES}" fill="none" stroke="${bande}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    ${o.devant ?? ''}
    ${roue(id + '-r1', 71)}${roue(id + '-r2', 245)}
  </g>`
}
function placerVoiture(id, x, y, s, distance) {
  $(id).setAttribute('transform', `translate(${x},${y}) scale(${s})`)
  const angle = (distance / (s * 16)) * (180 / Math.PI)   // les roues tournent au rythme du déplacement
  $(id + '-r1').setAttribute('transform', `rotate(${angle} 71 57)`)
  $(id + '-r2').setAttribute('transform', `rotate(${angle} 245 57)`)
}

/* ═══════════════ Décors : nuages, collines, arbres, herbe ═══════════════ */
function nuage(id, x, y, s, teinte = '#FFFFFF', ombre = '#D9E6F1') {
  return `<g id="${id}" transform="translate(${x},${y}) scale(${s})" filter="url(#aquarelle)">
    <ellipse cx="0" cy="40" rx="190" ry="42" fill="${ombre}"/>
    <circle cx="-110" cy="20" r="60" fill="${teinte}"/><circle cx="-40" cy="-10" r="85" fill="${teinte}"/><circle cx="50" cy="-30" r="100" fill="${teinte}"/>
    <circle cx="140" cy="5" r="70" fill="${teinte}"/><ellipse cx="10" cy="30" rx="180" ry="38" fill="${teinte}"/>
    <ellipse cx="20" cy="52" rx="170" ry="16" fill="${ombre}" opacity=".8"/></g>`
}
function arbre(x, y, s, v = ['#4E8B57', '#6FAA66', '#9CCB7E']) {
  return `<g class="arbre" data-x="${x}" data-y="${y}" transform="translate(${x},${y}) scale(${s})">
    <path d="M-5,0 L-3,-60 L3,-60 L5,0Z" fill="#6B4E3A"/>
    <g filter="url(#aquarelle)"><circle cx="0" cy="-90" r="46" fill="${v[0]}"/><circle cx="-32" cy="-70" r="32" fill="${v[0]}"/><circle cx="30" cy="-68" r="34" fill="${v[0]}"/>
    <circle cx="-8" cy="-104" r="30" fill="${v[1]}"/><circle cx="22" cy="-86" r="22" fill="${v[1]}"/><circle cx="-16" cy="-112" r="14" fill="${v[2]}"/></g></g>`
}
function herbe(id, n, graine, y0 = 1080, hMin = 40, hMax = 110, couleurs = ['#5D9A5B', '#7DB56B', '#4C8150']) {
  const r = hasard(graine)
  let h = `<g id="${id}">`
  for (let i = 0; i < n; i++) {
    const x = r() * 1960 - 20, haut = lerp(hMin, hMax, r()), c = couleurs[Math.floor(r() * couleurs.length)]
    h += `<path class="brin" data-x="${x.toFixed(1)}" data-h="${haut.toFixed(1)}" data-p="${(r() * 6).toFixed(2)}" data-y="${y0}" fill="${c}"/>`
  }
  return h + '</g>'
}
function animerHerbe(id, t, vent = 1) {
  for (const b of $(id).children) {
    const x = +b.dataset.x, h = +b.dataset.h, p = +b.dataset.p, y = +b.dataset.y
    const plie = (Math.sin(t * 2.2 + p + x * 0.004) * 10 + 14) * vent
    b.setAttribute('d', `M${x - 5},${y} Q${x - 2 + plie * 0.4},${y - h * 0.55} ${x + plie},${y - h} Q${x + 3 + plie * 0.3},${y - h * 0.5} ${x + 5},${y}Z`)
  }
}
function animerArbres(scene, t) {
  scene.querySelectorAll('.arbre').forEach((a, i) => {
    const x = a.dataset.x, y = a.dataset.y, s = a.getAttribute('transform').match(/scale\(([^)]+)\)/)[1]
    a.setAttribute('transform', `translate(${x},${y}) scale(${s}) rotate(${Math.sin(t * 1.3 + i) * 1.8})`)
  })
}
function feuilles(id, n, graine) {
  const r = hasard(graine), c = ['#6FAA66', '#9CCB7E', '#E3B75B', '#4E8B57']
  let h = `<g id="${id}">`
  for (let i = 0; i < n; i++) h += `<path class="feuille" data-v="${(0.6 + r() * 0.8).toFixed(2)}" data-y="${(120 + r() * 820).toFixed(0)}" data-d="${r().toFixed(3)}" data-a="${(r() * 60 + 20).toFixed(0)}" d="M0,0 Q9,-9 18,0 Q9,9 0,0Z" fill="${c[i % c.length]}"/>`
  return h + '</g>'
}
function animerFeuilles(id, t, sens = -1) {
  for (const f of $(id).children) {
    const v = +f.dataset.v, y0 = +f.dataset.y, d = +f.dataset.d, a = +f.dataset.a
    const k = ((t * 0.28 * v + d) % 1)
    const x = sens < 0 ? lerp(2020, -100, k) : lerp(-100, 2020, k)
    const y = y0 + Math.sin(t * 2 + d * 10) * a
    f.setAttribute('transform', `translate(${x},${y}) rotate(${t * 140 * v + d * 360}) scale(${1.2 + v})`)
  }
}
function trainees(id, lignes) {
  // traînées de vent : [décalage vertical, longueur, épaisseur, opacité]
  return `<g id="${id}" fill="none" stroke="#FFFFFF" stroke-linecap="round">` +
    lignes.map(([dy, l, e, o]) => `<path data-dy="${dy}" data-l="${l}" stroke-width="${e}" opacity="${o}" pathLength="100" stroke-dasharray="55 45"/>`).join('') + '</g>'
}
function animerTrainees(id, xArriere, yRef, t, force = 1) {
  for (const p of $(id).children) {
    const dy = +p.dataset.dy, l = +p.dataset.l * force
    p.setAttribute('d', `M${xArriere},${yRef + dy} C${xArriere - l * 0.3},${yRef + dy - 6} ${xArriere - l * 0.7},${yRef + dy + 6} ${xArriere - l},${yRef + dy}`)
    p.setAttribute('stroke-dashoffset', (t * 160) % 100)
    p.style.opacity = force
  }
}
function engrenage(dents, rExt, rInt) {
  let d = ''
  for (let i = 0; i < dents * 2; i++) {
    const a1 = (i / (dents * 2)) * Math.PI * 2, a2 = ((i + 1) / (dents * 2)) * Math.PI * 2, r = i % 2 ? rInt : rExt
    d += `${i ? 'L' : 'M'}${(Math.cos(a1) * r).toFixed(1)},${(Math.sin(a1) * r).toFixed(1)} L${(Math.cos(a2) * r).toFixed(1)},${(Math.sin(a2) * r).toFixed(1)} `
  }
  return d + 'Z'
}
function etoile4(x, y, r, couleur = '#FFF6D8') { return `<path d="M${x},${y - r} Q${x + r * 0.18},${y - r * 0.18} ${x + r},${y} Q${x + r * 0.18},${y + r * 0.18} ${x},${y + r} Q${x - r * 0.18},${y + r * 0.18} ${x - r},${y} Q${x - r * 0.18},${y - r * 0.18} ${x},${y - r}Z" fill="${couleur}"/>` }

/* ═══════════════ Définitions communes ═══════════════ */
const DEFS = `<defs>
  <filter id="aquarelle" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="8" result="b"/><feDisplacementMap in="SourceGraphic" in2="b" scale="9"/><feGaussianBlur stdDeviation="0.8"/></filter>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="doux" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
  <linearGradient id="cielJour" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5FA8DA"/><stop offset=".55" stop-color="#B9E0F2"/><stop offset="1" stop-color="#FCE8CC"/></linearGradient>
  <linearGradient id="cielSoir" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A4585"/><stop offset=".42" stop-color="#B96B8C"/><stop offset=".7" stop-color="#F1A266"/><stop offset="1" stop-color="#FCD690"/></linearGradient>
  <linearGradient id="cielNuit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1433"/><stop offset=".7" stop-color="#23365F"/><stop offset="1" stop-color="#3C4D72"/></linearGradient>
  <linearGradient id="collineLoin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9DC4B0"/><stop offset="1" stop-color="#B8D6C0"/></linearGradient>
  <linearGradient id="collineMoy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7DB374"/><stop offset="1" stop-color="#5E9A5E"/></linearGradient>
  <linearGradient id="collinePres" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8CC47A"/><stop offset="1" stop-color="#5C9657"/></linearGradient>
  <linearGradient id="atelierMur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E3BF"/><stop offset="1" stop-color="#EACB98"/></linearGradient>
  <linearGradient id="atelierSol" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CDB592"/><stop offset="1" stop-color="#B89D78"/></linearGradient>
  <linearGradient id="cabine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF3F6"/><stop offset="1" stop-color="#CCD8E1"/></linearGradient>
  <radialGradient id="soleil"><stop offset="0" stop-color="#FFF6D6"/><stop offset=".35" stop-color="#FFE7A8" stop-opacity=".9"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient>
  <radialGradient id="lampe"><stop offset="0" stop-color="#FFE7AE" stop-opacity=".95"/><stop offset="1" stop-color="#FFE7AE" stop-opacity="0"/></radialGradient>
  <radialGradient id="gyro"><stop offset="0" stop-color="#FFB33B"/><stop offset="1" stop-color="#FFB33B" stop-opacity="0"/></radialGradient>
  <linearGradient id="phares" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF1B8" stop-opacity=".75"/><stop offset="1" stop-color="#FFF1B8" stop-opacity="0"/></linearGradient>
  <pattern id="vigne" width="46" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)"><rect width="46" height="18" fill="#7FB36E"/><path d="M0,9 H46" stroke="#4F8747" stroke-width="5" stroke-dasharray="7 5"/></pattern>
  <pattern id="tuiles" width="48" height="28" patternUnits="userSpaceOnUse"><rect width="48" height="28" fill="#B6412F"/><path d="M0,14 L12,0 L24,14 L12,28Z" fill="#E1B23C"/><path d="M24,14 L36,0 L48,14 L36,28Z" fill="#2F6B4E"/><path d="M12,0 L24,14 L36,0Z M12,28 L24,14 L36,28Z" fill="#26211F"/></pattern>
  <pattern id="lattes" width="20" height="26" patternUnits="userSpaceOnUse"><rect width="20" height="26" fill="#C9372B"/><path d="M0,24 H20" stroke="#8E2419" stroke-width="3"/></pattern>
  <clipPath id="cadre"><rect width="1920" height="1080"/></clipPath>
</defs>`

/* ═══════════════ Scènes ═══════════════ */
const SCENES = []
const film = $('film')
function scene(debut, fin, svg, html, rendu) {
  const el = document.createElement('section'); el.className = 's'
  el.innerHTML = `<svg viewBox="0 0 1920 1080">${SCENES.length ? '' : DEFS}${svg}</svg>${html}`
  film.appendChild(el)
  SCENES.push({ debut, fin, el, rendu })
}
function carte(etq, titre, sous, id = '') {
  return `<div class="carte" ${id ? `id="${id}"` : ''}><span class="etq">${etq}</span><div class="titre">${titre}</div><div class="sous">${sous}</div></div>`
}
function montrerCarte(el, t, debut = 0.5, fin = 99) {
  const k = sortie(entre(t, debut, debut + 0.6)) * (1 - lisse(entre(t, fin - 0.4, fin)))
  el.style.opacity = k
  el.style.transform = `translateY(${(1 - k) * 30}px)`
}
function collines(extra = '') {
  return `<path d="M0,640 C260,560 520,600 760,570 C1040,530 1300,600 1560,560 C1740,535 1850,560 1920,570 V1080 H0Z" fill="url(#collineLoin)" filter="url(#aquarelle)"/>
  <path d="M0,720 C300,650 600,700 900,670 C1200,640 1500,700 1920,660 V1080 H0Z" fill="url(#vigne)" filter="url(#aquarelle)" opacity=".95"/>
  <path d="M0,720 C300,650 600,700 900,670 C1200,640 1500,700 1920,660" fill="none" stroke="#A6D08E" stroke-width="6" opacity=".7" filter="url(#aquarelle)"/>
  ${extra}
  <path d="M0,820 C320,780 700,800 1000,790 C1350,778 1650,800 1920,790 V1080 H0Z" fill="url(#collinePres)" filter="url(#aquarelle)"/>`
}

/* 1 · Ouverture : ciel, collines de vignes, la voiture arrive dans le vent (0 – 6 s) */
scene(0, 6,
  `<g id="s1-monde">
    <rect width="1920" height="1300" y="-220" fill="url(#cielJour)"/>
    <circle cx="1560" cy="120" r="260" fill="url(#soleil)"/>
    ${nuage('s1-n1', 300, 150, 1.1)}${nuage('s1-n2', 1000, 90, 1.4)}${nuage('s1-n3', 1650, 250, 0.9)}${nuage('s1-n4', 700, 330, 0.6, '#FFFFFF', '#E5EEF5')}
    ${collines(arbre(260, 700, 0.9) + arbre(1480, 690, 1.1) + arbre(1560, 700, 0.8) + arbre(900, 685, 0.7))}
    <path d="M0,905 C500,890 1400,890 1920,900 V965 C1400,955 500,955 0,968Z" fill="#E6D3AE" filter="url(#aquarelle)"/>
    <path d="M0,936 C500,923 1400,923 1920,932" fill="none" stroke="#FFF8E6" stroke-width="5" stroke-dasharray="46 38" opacity=".8"/>
    ${trainees('s1-vent', [[-150, 520, 4, .8], [-95, 700, 3, .6], [-40, 460, 3.5, .7], [20, 620, 2.5, .5]])}
    ${voiture('s1-auto')}
    ${herbe('s1-herbe', 150, 11, 1085)}
    ${feuilles('s1-feuilles', 22, 5)}
  </g>`,
  `<div class="grand-titre" id="s1-titre" style="top:120px"><div style="font-weight:900;font-size:128px;letter-spacing:2px">Cars Factory 21</div>
   <div style="font-weight:700;font-size:40px;margin-top:6px">Carrosserie · Mécanique · Chevigny-Saint-Sauveur</div></div>`,
  (t) => {
    $('s1-monde').setAttribute('transform', `translate(0,${lerp(-140, 0, sortie(entre(t, 0, 3.2)))})`)
    ;['s1-n1', 's1-n2', 's1-n3', 's1-n4'].forEach((n, i) => { const x = [300, 1000, 1650, 700][i] + t * [14, 9, 18, 24][i]; $(n).setAttribute('transform', `translate(${x},${[150, 90, 250, 330][i]}) scale(${[1.1, 1.4, 0.9, 0.6][i]})`) })
    const k = sortie(entre(t, 0.8, 4.6)), x = lerp(-900, 560, k), s = 2.6
    placerVoiture('s1-auto', x, 918 - 74 * s, s, x)
    animerTrainees('s1-vent', x + 20 * s, 918 - 30 * s, t, 1 - entre(t, 4.2, 5.2) * 0.6)
    animerHerbe('s1-herbe', t, 1.2); animerFeuilles('s1-feuilles', t); animerArbres(SCENES[0].el, t)
    const titre = $('s1-titre'), kt = sortie(entre(t, 2.4, 3.4)); titre.style.opacity = kt; titre.style.transform = `translateY(${(1 - kt) * 24}px)`
  })

/* 2 · Le garage : toit de tuiles vernissées, rideau qui se lève, la voiture entre (6 – 11 s) */
scene(6, 11,
  `<rect width="1920" height="1080" fill="url(#cielJour)"/>
   ${nuage('s2-n1', 260, 170, 1)}${nuage('s2-n2', 1500, 120, 1.2)}
   ${collines(arbre(180, 700, 1) + arbre(1750, 690, 1.1))}
   <path d="M0,905 C500,890 1400,890 1920,900 V1080 H0Z" fill="#E6D3AE" filter="url(#aquarelle)"/>
   <g filter="url(#aquarelle)">
     <rect x="760" y="440" width="880" height="470" fill="#F7EFE2" stroke="#6B5B4B" stroke-width="4"/>
     <path d="M700,448 L1700,448 L1580,290 L820,290Z" fill="url(#tuiles)" stroke="#4A3A30" stroke-width="5" stroke-linejoin="round"/>
   </g>
   <rect x="980" y="470" width="440" height="72" rx="10" fill="#2E2A28"/>
   <text x="1200" y="522" text-anchor="middle" font-family="BC" font-size="48" letter-spacing="5" fill="#F5EDDF">CARS <tspan fill="#E24A36">FACTORY</tspan> 21</text>
   <rect x="880" y="570" width="640" height="340" fill="#F2C879"/>
   <circle cx="1200" cy="690" r="260" fill="url(#lampe)"/>
   <path d="M900,910 L960,700 L1440,700 L1500,910" fill="#E9B865" opacity=".5"/>
   <rect id="s2-rideau" x="880" y="570" width="640" height="340" fill="url(#lattes)" stroke="#6B2A20" stroke-width="3"/>

const DUREE = 48, FONDU = 0.7
window.DUREE = DUREE
window.rendre = (t) => {
  SCENES.forEach((s, i) => {
    const visible = t >= s.debut && t < s.fin + (i < SCENES.length - 1 ? FONDU : 0)
    if (!visible) { s.el.style.opacity = 0; return }
    s.el.style.opacity = i === 0 ? 1 : lisse((t - s.debut) / FONDU)
    s.rendu(t - s.debut)
  })
}
